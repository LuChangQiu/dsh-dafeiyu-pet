# ruff（Python 代码规范，120 列；仅检查 pet/ 与脚本生成的补丁）
line-length = 120
target-version = "py311"
exclude = ["pet/assets", "pet/sprites", "node_modules"]

[lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E741", "F403", "F405", "E722"]

[lint.per-file-ignores]
# 上游遗留文件：不做行为改动的历史风格豁免；新增补丁段仍按规范书写。
"pet/桌宠.py" = ["E501", "E402", "F401", "F841", "E711", "E712", "E713", "E714", "E722", "F811", "E731", "E741", "I001", "W293", "W291"]
